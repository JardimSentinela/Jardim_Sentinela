spring.application.name=api-jardim-sentinela
spring.datasource.url=jdbc:h2:file:./data/jardimsentinela
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# [SCRUM-20][SW-11] Origens liberadas para o dashboard gerado consumir a API.
# "*" so' serve pra dev/preview. Antes de ir pra qualquer ambiente real, trocar
# pela URL fixa do dashboard publicado (lista separada por virgula).
jardimsentinela.cors.allowed-origins=*

spring.application.name=api-jardim-sentinela
spring.datasource.url=jdbc:h2:file:./data/jardimsentinela
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# [SCRUM-20][SW-11] Origens liberadas para o dashboard consumir a API (lista separada por virgula).
# Lista fechada: sem "*". Acrescentar a URL do dashboard publicado quando houver deploy.
jardimsentinela.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# [SCRUM-28][SW-14] Tendencia de nivel (GET /api/jardins/{id}/tendencia).
# ATENCAO: valores EXPERIMENTAIS, definidos com experimentos no simulador
# (docs/tendencia-nivel.md, secao 13). NAO estao calibrados para o hardware real.
# A janela (N = 5 leituras) e' constante do codigo (decisao D2), nao propriedade.
#  - tolerancia-cm: tolerancia absoluta, em cm, sobre a variacao liquida da janela.
#  - idade-maxima: tempo maximo desde a ultima RECEPCAO pela API (nao desde a
#    medicao) para o dado ainda ser atual. Formato: 30s, 2m, PT30S.
#  - tamanho-pagina: leituras lidas por consulta ao montar a janela. Nao muda o
#    resultado, so o numero de consultas.
jardimsentinela.tendencia.tolerancia-cm=1.5
jardimsentinela.tendencia.idade-maxima=30s
jardimsentinela.tendencia.tamanho-pagina=50
